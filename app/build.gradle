plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// Force sqlite-jdbc to a version that includes Windows x86_64 native libs.
// Room 2.6.1 pulls in sqlite-jdbc 3.41.2.2 which is broken on Windows JDK 17+.
// 3.45.3.0 ships the correct DLL and fixes the AccessDeniedException crash.
configurations.all {
    resolutionStrategy {
        force 'org.xerial:sqlite-jdbc:3.45.3.0'
    }
}

android {
    namespace 'com.axiominfratech.geostamp'
    compileSdk 36

    defaultConfig {
        applicationId "com.axiominfratech.geostamp"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                // Disable Room's compile-time DB verification — this is what triggers
                // sqlite-jdbc and causes the Windows native DLL crash entirely.
                arguments = [
                    "room.schemaLocation" : "$projectDir/schemas".toString(),
                    "room.incremental"    : "true",
                    "room.verifyDbSchema" : "false"
                ]
            }
        }
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty("RELEASE_STORE_FILE")
            def storePasswordValue = project.findProperty("RELEASE_STORE_PASSWORD")
            def keyAliasValue = project.findProperty("RELEASE_KEY_ALIAS")
            def keyPasswordValue = project.findProperty("RELEASE_KEY_PASSWORD")
            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.findProperty("RELEASE_STORE_FILE")) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental",    "true")
        arg("room.verifyDbSchema", "false")
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-guava:1.7.3"

    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    implementation 'com.google.android.gms:play-services-location:21.1.0'

    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'com.google.android.play:integrity:1.3.0'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.opencsv:opencsv:5.9'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.vmadalin:easypermissions-ktx:1.0.0'
    implementation 'com.google.zxing:core:3.5.3'

    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
}
